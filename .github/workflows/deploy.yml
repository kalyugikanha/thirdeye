name: ThirdEye Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test_and_build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Backend Dependencies & Verify Syntax
      run: |
        cd apps/api
        python -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt
        python -c "import ast; ast.parse(open('app/main.py', encoding='utf-8').read()); print('FastAPI Syntax OK')"
        python -c "import ast; ast.parse(open('app/models.py', encoding='utf-8').read()); print('Models Syntax OK')"

    - name: Set up Node.js 18
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Frontend Dependencies & Run Production Build
      run: |
        cd apps/web
        npm install
        npx next build --no-lint

    - name: Deploy Verification Complete
      run: echo "🎉 ThirdEye CI/CD Build Verification Passed Successfully!"
