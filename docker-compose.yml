version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: thirdeye_postgres
    environment:
      POSTGRES_USER: thirdeye
      POSTGRES_PASSWORD: thirdeye_password
      POSTGRES_DB: thirdeye_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
