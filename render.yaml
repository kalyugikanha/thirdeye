services:
  # 1. Python FastAPI Backend Service
  - type: web
    name: thirdeye-backend
    env: python
    region: oregon
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # 2. Next.js Frontend Service
  - type: web
    name: thirdeye-frontend
    env: node
    region: oregon
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: NEXT_PUBLIC_API_URL
        value: https://thirdeye-backend.onrender.com
